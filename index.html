<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            height: 100vh;
            background: #f5f5f5;
        }

        .sidebar {
            width: 280px;
            background: #2c3e50;
            color: white;
            overflow-y: auto;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 20px;
            font-size: 18px;
            color: #ecf0f1;
        }

        .folder {
            margin-bottom: 10px;
        }

        .folder-name {
            font-weight: bold;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 4px;
            transition: background 0.2s;
            user-select: none;
        }

        .folder-name:hover {
            background: #34495e;
        }

        .folder-name::before {
            content: '📁 ';
            margin-right: 5px;
        }

        .folder-name.expanded::before {
            content: '📂 ';
        }

        .file-list {
            margin-left: 20px;
            margin-top: 5px;
            display: none;
        }

        .file-list.show {
            display: block;
        }

        .file-item {
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            margin-bottom: 2px;
        }

        .file-item:hover {
            background: #34495e;
        }

        .file-item.active {
            background: #3498db;
        }

        .file-item::before {
            content: '📄 ';
            margin-right: 5px;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            background: white;
        }

        .content-inner {
            max-width: 800px;
            margin: 0 auto;
        }

        .content h1 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .content h2 {
            margin-top: 30px;
            margin-bottom: 15px;
            color: #34495e;
        }

        .content h3 {
            margin-top: 25px;
            margin-bottom: 10px;
            color: #34495e;
        }

        .content p {
            line-height: 1.6;
            margin-bottom: 15px;
            color: #333;
        }

        .content code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }

        .content pre {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin-bottom: 15px;
        }

        .content pre code {
            background: none;
            padding: 0;
        }

        .content ul, .content ol {
            margin-left: 30px;
            margin-bottom: 15px;
        }

        .content li {
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .content blockquote {
            border-left: 4px solid #3498db;
            padding-left: 20px;
            margin: 20px 0;
            color: #555;
            font-style: italic;
        }

        .content a {
            color: #3498db;
            text-decoration: none;
        }

        .content a:hover {
            text-decoration: underline;
        }

        .content img {
            max-width: 100%;
            height: auto;
            margin: 20px 0;
        }

        .error {
            color: #e74c3c;
            padding: 20px;
        }

        .placeholder {
            color: #95a5a6;
            text-align: center;
            padding: 40px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Documents</h2>
        <div id="file-tree">
            <div class="loading">Loading files...</div>
        </div>
    </div>
    <div class="content">
        <div class="content-inner" id="markdown-content">
            <div class="placeholder">
                <h2>Welcome to Markdown Viewer</h2>
                <p>Select a file from the sidebar to view its contents.</p>
            </div>
        </div>
    </div>

    <script>
        const DOCS_FOLDER = 'docs'; // Change this to your docs folder path
        let fileStructure = {};

        // Scan the docs folder and build file structure
        async function scanDocsFolder() {
            try {
                const response = await fetch('structure.json');
                if (!response.ok) {
                    throw new Error('structure.json not found');
                }
                fileStructure = await response.json();
                initFileTree();
            } catch (e) {
                showError('Could not load file structure. Make sure structure.json exists.');
                console.error(e);
            }
        }

        // Initialize the file tree
        function initFileTree() {
            const tree = document.getElementById('file-tree');
            tree.innerHTML = '';

            if (Object.keys(fileStructure).length === 0) {
                tree.innerHTML = '<div class="error">No folders found</div>';
                return;
            }

            for (const [folder, files] of Object.entries(fileStructure)) {
                const folderDiv = document.createElement('div');
                folderDiv.className = 'folder';

                const folderName = document.createElement('div');
                folderName.className = 'folder-name';
                folderName.textContent = folder;
                
                const fileList = document.createElement('div');
                fileList.className = 'file-list';

                files.forEach(filename => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    fileItem.textContent = filename;
                    fileItem.onclick = () => loadMarkdown(folder, filename, fileItem);
                    fileList.appendChild(fileItem);
                });

                folderName.onclick = () => {
                    folderName.classList.toggle('expanded');
                    fileList.classList.toggle('show');
                };

                // Auto-expand first folder
                if (tree.children.length === 0) {
                    folderName.classList.add('expanded');
                    fileList.classList.add('show');
                }

                folderDiv.appendChild(folderName);
                folderDiv.appendChild(fileList);
                tree.appendChild(folderDiv);
            }
        }

        // Load and display markdown content
        async function loadMarkdown(folder, filename, element) {
            const contentDiv = document.getElementById('markdown-content');
            contentDiv.innerHTML = '<div class="loading">Loading...</div>';
            
            try {
                const filepath = `${DOCS_FOLDER}/${folder}/${filename}`;
                const response = await fetch(filepath);
                
                if (!response.ok) {
                    throw new Error(`Failed to load ${filename}`);
                }

                const markdown = await response.text();
                const html = marked.parse(markdown);
                contentDiv.innerHTML = html;

                // Update active state
                document.querySelectorAll('.file-item').forEach(el => {
                    el.classList.remove('active');
                });
                element.classList.add('active');

            } catch (e) {
                contentDiv.innerHTML = `<div class="error">Error loading file: ${e.message}</div>`;
            }
        }

        function showError(message) {
            const tree = document.getElementById('file-tree');
            tree.innerHTML = `<div class="error">${message}</div>`;
        }

        // Initialize on page load
        scanDocsFolder();
    </script>
</body>
</html>
